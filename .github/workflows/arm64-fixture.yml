name: ARM64 core research

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      test_discord:
        description: Post a labeled test message to the configured Discord channel
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: arm64-core-${{ github.ref }}
  queue: max

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public contribution scope
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != github.repository_owner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 -m tools.check_core_submission "$BASE_SHA" "$GITHUB_SHA" --title="$PR_TITLE"
      - name: Validate the core report and build the dashboard
        run: python3 project.py check
      - name: Check whether candidates are enrolled
        id: matching
        run: |
          count=$(python3 -m tools.match_core candidate-count)
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Install pinned Android NDK
        if: steps.matching.outputs.count != '0'
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            --output ndk.zip https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          printf '%s  %s\n' 22105e410cf29afcf163760cc95522b9fb981121 ndk.zip | sha1sum --check
          unzip -q ndk.zip
      - name: Verify enrolled candidates
        if: steps.matching.outputs.count != '0'
        run: python3 -m tools.match_core check-all --ndk "$RUNNER_TEMP/android-ndk-r27d"
      - id: artifact
        if: github.repository == '6Mouse/hcr2-research' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo "name=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.artifact.outputs.name != ''
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist

  dashboard:
    if: needs.verify.outputs.artifact != ''
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
        with:
          artifact_name: ${{ needs.verify.outputs.artifact }}

  discord:
    if: github.event_name == 'push' || inputs.test_discord
    needs: dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Announce verified core research and function matches
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DISCORD_MATCH_WEBHOOK: ${{ secrets.DISCORD_MATCH_WEBHOOK }}
        run: python3 -m tools.notify_core
      - name: Send a test message
        if: github.event_name == 'workflow_dispatch' && inputs.test_discord
        env:
          DISCORD_MATCH_WEBHOOK: ${{ secrets.DISCORD_MATCH_WEBHOOK }}
        run: python3 -m tools.notify_core --test
