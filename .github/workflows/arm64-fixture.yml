name: ARM64 matching pilot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_discord:
        description: Post a labeled test message to the configured Discord channel
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  arm64-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Android NDK
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            --output ndk.zip https://dl.google.com/android/repository/android-ndk-r30-beta1-linux.zip
          printf '%s  %s\n' 26b746e5a1e7ac3371f2a862a2f52a7c0740aa8a ndk.zip | sha1sum --check
          unzip -q ndk.zip
      - name: Check the reproducible build and exact function match
        run: |
          for manifest in fixtures/*/match.json; do
            fixture="${manifest%/match.json}"
            args=()
            if [[ ! -f "$fixture/candidate.cpp" ]]; then args+=(--reference-only); fi
            python3 tools/verify_fixture.py --fixture "$fixture" \
              --ndk "$RUNNER_TEMP/android-ndk-r30-beta1" "${args[@]}"
          done
      - name: Run the starter checks
        run: python3 project.py check

  dashboard-build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: arm64-fixture
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.artifact-name.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 project.py dashboard
      - id: artifact-name
        run: echo "value=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: ${{ steps.artifact-name.outputs.value }}
          path: dist

  dashboard:
    needs: dashboard-build
    runs-on: ubuntu-24.04
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deploy
        with:
          artifact_name: ${{ needs.dashboard-build.outputs.artifact }}

  discord:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.test_discord)
    needs: arm64-fixture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Announce new matches
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DISCORD_MATCH_WEBHOOK: ${{ secrets.DISCORD_MATCH_WEBHOOK }}
        run: python3 -m tools.notify_matches
      - name: Send a test message
        if: github.event_name == 'workflow_dispatch' && inputs.test_discord
        env:
          DISCORD_MATCH_WEBHOOK: ${{ secrets.DISCORD_MATCH_WEBHOOK }}
        run: python3 -m tools.notify_matches --test
