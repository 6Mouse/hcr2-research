name: ARM64 core research

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      test_discord:
        description: Post a labeled test message to the configured Discord channel
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: arm64-core-${{ github.ref }}
  queue: max

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approvals: ${{ steps.approve.outputs.matches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public contribution scope
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != github.repository_owner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 -m tools.check_core_submission "$BASE_SHA" "$GITHUB_SHA" --title="$PR_TITLE"
      - name: Validate the core report and build the dashboard
        run: python3 project.py check
      - name: Check whether candidates are enrolled
        id: matching
        run: |
          count=$(python3 -m tools.match_core candidate-count)
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Install pinned Android NDK
        if: steps.matching.outputs.count != '0'
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            --output ndk.zip https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          printf '%s  %s\n' 22105e410cf29afcf163760cc95522b9fb981121 ndk.zip | sha1sum --check
          unzip -q ndk.zip
      - name: Verify enrolled candidates
        if: steps.matching.outputs.count != '0'
        run: python3 -m tools.match_core check-all --ndk "$RUNNER_TEMP/android-ndk-r27d"
      - name: Find verified candidates merged by the owner
        id: approve
        if: github.repository == '6Mouse/hcr2-research' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.test_discord && steps.matching.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          matches=$(python3 -m tools.match_core discover-approvals)
          printf 'matches=%s\n' "$matches" >> "$GITHUB_OUTPUT"

  publish-catalog:
    if: github.repository == '6Mouse/hcr2-research' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.publish.outputs.revision }}
      promoted: ${{ steps.publish.outputs.promoted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ needs.verify.outputs.approvals != '' && needs.verify.outputs.approvals != '{}' }}
      - name: Publish verified matches
        id: publish
        env:
          MATCH_APPROVALS: ${{ needs.verify.outputs.approvals }}
        shell: bash
        run: |
          tip=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            echo 'Main advanced. Its next run will reconcile pending matches.'
            exit 0
          fi
          if [[ -n "$MATCH_APPROVALS" && "$MATCH_APPROVALS" != '{}' ]]; then
            python3 -m tools.match_core apply-approvals
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --only -m 'Record verified core function matches' -- core_matches.json
            if ! git push origin HEAD:refs/heads/main; then
              tip=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
              if [[ "$tip" == "$GITHUB_SHA" ]]; then
                exit 1
              fi
              echo 'Main advanced during publication. Its next run will reconcile pending matches.'
              exit 0
            fi
            echo 'promoted=true' >> "$GITHUB_OUTPUT"
          fi
          revision=$(git rev-parse HEAD)
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

  dashboard-build:
    if: needs.publish-catalog.outputs.revision != ''
    needs: publish-catalog
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish-catalog.outputs.revision }}
          persist-credentials: false
      - run: python3 project.py dashboard
      - id: artifact
        run: echo "name=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist

  dashboard:
    needs: dashboard-build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
        with:
          artifact_name: ${{ needs.dashboard-build.outputs.artifact }}

  discord:
    if: github.event_name == 'push' || inputs.test_discord || needs.publish-catalog.outputs.promoted == 'true'
    needs: [dashboard, publish-catalog]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish-catalog.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Announce verified core research and function matches
        if: github.event_name == 'push' || needs.publish-catalog.outputs.promoted == 'true'
        env:
          BEFORE: ${{ github.event.before || github.sha }}
          AFTER: ${{ needs.publish-catalog.outputs.revision }}
          DISCORD_MATCH_WEBHOOK: ${{ secrets.DISCORD_MATCH_WEBHOOK }}
        run: python3 -m tools.notify_core
      - name: Send a test message
        if: github.event_name == 'workflow_dispatch' && inputs.test_discord
        env:
          DISCORD_MATCH_WEBHOOK: ${{ secrets.DISCORD_MATCH_WEBHOOK }}
        run: python3 -m tools.notify_core --test
