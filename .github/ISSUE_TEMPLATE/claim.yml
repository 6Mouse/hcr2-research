name: Core observation
description: Report a reproducible result for the HCR2 1.76.1 ARM64 core.
title: "[HCR2-NNN] "
body:
  - type: input
    id: task
    attributes:
      label: Task ID
      placeholder: HCR2-001
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Setup and observed result
      description: Include the core SHA-256, exact command or test steps, measurements with units, and uncertainties. Keep game binaries and account data local.
    validations:
      required: true
