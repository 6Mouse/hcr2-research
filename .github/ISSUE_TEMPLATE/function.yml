name: Request one ARM64 function
description: Get the next available original fixture and its pinned build instructions
title: "[Function queue] Request one function"
labels: [function-queue]
body:
  - type: markdown
    attributes:
      value: The queue assigns one open fixture per GitHub account. If none is available, leave this issue open. Close it to release or cancel the request. Open a new request when you want more work.
  - type: checkboxes
    id: ready
    attributes:
      label: Before requesting work
      options:
        - label: I read AGENTS.md and will use the pinned Android ARM64 toolchain.
          required: true
